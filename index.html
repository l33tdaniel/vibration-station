<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vibration Station</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" />
    <meta name="theme-color" content="#0f5e7a" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vibration" />
    <style>
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --ground: #eef4f9; --card: #fff; --border: #dbe6ee;
        --accent: #0f7aa3; --header: #0f5e7a;
        --label: #16384a; --muted: #4a6072;
      }
      body {
        margin: 0; max-width: 480px; margin-inline: auto; color: var(--label); background: var(--ground);
        padding: calc(1rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right)) calc(1rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
      }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      .app-title { color: var(--header); font-size: 1.5rem; font-weight: 700; margin: .25rem .25rem 1rem; }
      h2 { font-size: .9rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--header); margin: 0 0 .9rem; }
      button { font-size: 1rem; font-weight: 600; padding: .7rem 1.1rem; border-radius: .55rem; border: none; background: var(--accent); color: #fff; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
      button:disabled { opacity: .45; cursor: default; }
      label { display: flex; align-items: center; gap: .75rem; font-size: 1rem; font-weight: 600; color: var(--label); margin: .9rem 0; }
      input[type="range"] { flex: 1; height: 44px; accent-color: var(--accent); }
      input[type="checkbox"] { width: 1.8rem; height: 1.8rem; accent-color: var(--accent); }
      .value-readout { font-size: .95rem; font-weight: 700; color: var(--accent); min-width: 62px; text-align: right; white-space: nowrap; }
      .value-readout input { width: 3.4em; font-size: .95rem; font-weight: 700; color: var(--accent); text-align: right; border: 1px solid var(--border); border-radius: .4rem; padding: .25rem; min-height: 36px; -moz-appearance: textfield; }
      .global-bar, .cards article { background: var(--card); border: 1px solid var(--border); border-radius: .9rem; padding: 1.25rem; margin: .85rem 0; }
      .cards article header { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 1.15rem; color: var(--label); margin-bottom: .5rem; }
      .hint { color: #b00020; min-height: 1.2em; }
      .unsupported { font-size: 1.1rem; line-height: 1.55; }
      .version { color: var(--muted); font-size: .8rem; margin-top: 2rem; text-align: center; }
      .profiles-section { margin: .85rem 0; }
      .profile-card { background: var(--card); border: 1px solid var(--border); border-radius: .9rem; padding: 1.1rem 1.25rem; margin: .85rem 0; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
      .profile-info { flex: 1; }
      .profile-name { font-weight: 700; font-size: 1.15rem; color: var(--label); }
      .profile-meta { display: inline-block; font-size: .85rem; font-weight: 600; color: var(--header); background: #e3f3f9; padding: .25rem .7rem; border-radius: 1rem; margin-top: .4rem; }
      .profile-actions { display: flex; flex-direction: column; gap: .4rem; align-items: stretch; }
      .profile-actions [data-action="start"] { min-width: 104px; }
      .profile-subactions { display: flex; gap: .25rem; justify-content: flex-end; }
      .profile-actions .secondary { background: none; color: var(--muted); padding: .35rem .55rem; min-height: 40px; font-size: .9rem; }
      .add-btn { width: 100%; background: #f7fbfd; color: var(--header); border: 2px dashed #b8d3e1; font-weight: 600; margin: .6rem 0; }
      .add-btn:disabled { border-style: solid; }
      .connect { margin: 0; }
      .connect .hint:empty { min-height: 0; }
      .battery-pill { font-size: .85rem; font-weight: 700; color: #1d7a45; background: #e6f5ec; padding: .25rem .7rem; border-radius: 1rem; }
      .battery-pill.warn { color: #8a5a00; background: #fdf0d8; }
      .battery-pill.low { color: #b00020; background: #fbe1e5; }
      .timer-display { text-align: center; padding: 2rem 1.5rem; background: var(--card); border: 1px solid var(--border); border-radius: .9rem; }
      .timer-countdown { font-size: 2.5rem; font-family: monospace; font-weight: bold; color: var(--accent); margin: 1rem 0; }
      .timer-devices { font-size: 1rem; color: var(--muted); margin: 1rem 0; }
      .timer-stop { min-height: 50px; font-size: 1.25rem; background: #d64545; color: #fff; }
      .modal-overlay { position: fixed; inset: 0; background: rgba(15,40,55,.45); display: flex; align-items: center; justify-content: center; z-index: 1000; }
      .modal-content { background: var(--card); border-radius: 1rem; padding: 1.75rem; max-width: 90%; max-height: 90vh; overflow-y: auto; }
      .modal-header { font-size: 1.25rem; font-weight: 700; color: var(--header); margin-bottom: 1rem; }
      .device-picker { display: flex; flex-direction: column; gap: 1rem; }
      .device-picker label { margin: .5rem 0; }
      .form-field { display: flex; flex-direction: column; gap: .4rem; margin: 1rem 0; }
      .form-field label { font-size: 1rem; font-weight: 600; }
      .form-field input[type="text"], .form-field input[type="number"] { padding: .7rem; font-size: 1rem; border: 1px solid var(--border); border-radius: .5rem; }
      .form-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
      .form-actions button { flex: 1; }
      .form-actions button.cancel { background: #eef4f9; color: var(--header); }
      .error-message { color: #b00020; font-size: .95rem; margin-top: .25rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      // ===== Device contract (matches Bluetooth_Board_Code.ino) =====
      // Battery service 180F / char 2A19: uint8 0-100 % (read+notify) — real battery.
      // Motor service 6e500001.. / char 6e500002..: int (read+write).
      //   Value is a 4-byte little-endian int: 0 = motor off, 80-160 = intensity.
      const BATTERY_SERVICE_UUID = "0000180f-0000-1000-8000-00805f9b34fb";
      const BATTERY_LEVEL_CHAR_UUID = "00002a19-0000-1000-8000-00805f9b34fb";
      const MOTOR_SERVICE_UUID = "6e500001-b5a3-f393-e0a9-e50e24dcca9e";
      const MOTOR_CHAR_UUID = "6e500002-b5a3-f393-e0a9-e50e24dcca9e";
      const DEVICE_NAME_PREFIX = "Vibration Device";
      const FREQ_MIN = 80;
      const FREQ_MAX = 160;
      const MAX_DEVICES = 4;
      const VERSION = "2026-06-05.2"; // bump on each deploy; shown at page bottom

      // ===== Encoding =====
      function clamp(value, min, max) {
        if (Number.isNaN(value)) return min;
        return Math.min(max, Math.max(min, Math.round(value)));
      }
      // Firmware reads one int: 0 = off, otherwise the clamped frequency.
      function encodeMotor(power, hz) {
        const value = power ? clamp(hz, FREQ_MIN, FREQ_MAX) : 0;
        const buf = new Uint8Array(4);
        new DataView(buf.buffer).setInt32(0, value, true);
        return buf;
      }

      // ===== State =====
      // ===== ProfileStore (localStorage) =====
      class ProfileStore {
        constructor() {
          this.profiles = [];
          this.load();
        }
        load() {
          try {
            const data = localStorage.getItem("vibration-profiles");
            const parsed = data ? JSON.parse(data) : [];
            this.profiles = Array.isArray(parsed)
              ? parsed.filter((p) => p && typeof p.id === "string" && ProfileStore.valid(p.name, p.frequency, p.duration))
              : [];
          } catch (e) {
            console.error("Failed to load profiles:", e);
            this.profiles = [];
          }
        }
        save() {
          try {
            localStorage.setItem("vibration-profiles", JSON.stringify(this.profiles));
          } catch (e) {
            console.error("Failed to save profiles:", e);
            return false;
          }
          return true;
        }
        static valid(name, frequency, duration) {
          return !!name &&
            Number.isFinite(frequency) && frequency >= 80 && frequency <= 160 &&
            Number.isFinite(duration) && duration >= 1 && duration <= 60;
        }
        newId() {
          return (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.round(performance.now())}`;
        }
        create(name, frequency, duration) {
          if (!ProfileStore.valid(name, frequency, duration)) return null;
          const profile = {
            id: this.newId(),
            name,
            frequency: Math.round(frequency),
            duration: Math.round(duration),
          };
          this.profiles.push(profile);
          if (!this.save()) { this.profiles.pop(); return null; } // storage failed
          return profile;
        }
        update(id, name, frequency, duration) {
          const p = this.profiles.find((x) => x.id === id);
          if (!p) return null;
          if (!ProfileStore.valid(name, frequency, duration)) return null;
          const prev = { name: p.name, frequency: p.frequency, duration: p.duration };
          p.name = name;
          p.frequency = Math.round(frequency);
          p.duration = Math.round(duration);
          if (!this.save()) { Object.assign(p, prev); return null; } // storage failed
          return p;
        }
        delete(id) {
          this.profiles = this.profiles.filter((p) => p.id !== id);
          this.save();
        }
        get(id) {
          return this.profiles.find((p) => p.id === id);
        }
        getAll() {
          return [...this.profiles];
        }
      }

      // ===== Timer =====
      class TimerState {
        constructor() {
          this.isRunning = false;
          this.secondsLeft = 0;
          this.deviceIds = [];
          this.profileId = null;
          this.intervalId = null;
          this.endTime = 0;
        }
        start(profile, deviceIds, onTick, onComplete) {
          const totalMs = profile.duration * 60 * 1000;
          if (!Number.isFinite(totalMs) || totalMs <= 0) return false; // bad data: never start
          this.isRunning = true;
          this.deviceIds = deviceIds;
          this.profileId = profile.id;
          // Derive remaining time from a fixed end timestamp so setInterval
          // jitter and float accumulation can't drift the countdown.
          this.endTime = performance.now() + totalMs;
          this.secondsLeft = (this.endTime - performance.now()) / 1000;
          this.intervalId = setInterval(() => {
            this.secondsLeft = Math.max(0, (this.endTime - performance.now()) / 1000);
            onTick(this.secondsLeft);
            if (this.secondsLeft <= 0) {
              this.stop();
              onComplete();
            }
          }, 100);
        }
        stop() {
          this.isRunning = false;
          if (this.intervalId) clearInterval(this.intervalId);
          this.intervalId = null;
          this.secondsLeft = 0;
          this.deviceIds = [];
          this.profileId = null;
          this.endTime = 0;
        }
        formatTime(seconds) {
          const mins = Math.floor(seconds / 60);
          const secs = Math.floor(seconds % 60);
          return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
        }
      }

      const DEFAULT_GLOBAL = { power: false, frequency: 120 };

      function resolveSettings(state, id) {
        const d = state.devices.find((x) => x.id === id);
        if (!d) throw new Error(`unknown device ${id}`);
        return d.mode === "custom" ? d.custom : state.global;
      }
      async function pushSettings(ble, id, s) {
        await ble.setPower(id, s.power);
        await ble.setFrequency(id, s.frequency);
      }

      class AppStore {
        constructor() {
          this.state = { global: { ...DEFAULT_GLOBAL }, devices: [] };
          this.listeners = [];
        }
        get() {
          return { global: { ...this.state.global }, devices: [...this.state.devices] };
        }
        subscribe(fn) { this.listeners.push(fn); }
        emit() { for (const l of this.listeners) l(); }
        find(id) { return this.state.devices.find((d) => d.id === id); }
        setGlobal(p) { this.state.global = { ...this.state.global, ...p }; this.emit(); }
        addDevice(id, name) {
          if (this.find(id)) return;
          this.state.devices.push({ id, name, mode: "follow", custom: { ...this.state.global }, battery: null });
          this.emit();
        }
        removeDevice(id) {
          this.state.devices = this.state.devices.filter((d) => d.id !== id);
          this.emit();
        }
        setDeviceMode(id, mode) { const d = this.find(id); if (!d) return; d.mode = mode; this.emit(); }
        setDeviceCustom(id, p) { const d = this.find(id); if (!d) return; d.custom = { ...d.custom, ...p }; this.emit(); }
        setDeviceBattery(id, pct) { const d = this.find(id); if (!d) return; d.battery = pct; this.emit(); }
      }

      // ===== BLE: in-memory fake (used with ?fake) =====
      class FakeBleService {
        constructor() { this.calls = []; this.counter = 0; this.disconnectCb = null; }
        isSupported() { return true; }
        async requestDevice() {
          const n = ++this.counter;
          this.calls.push({ m: "requestDevice", args: [] });
          const id = `fake-${n}`;
          setTimeout(() => { if (this.batteryCb) this.batteryCb(id, 82); }, 50);
          return { id, name: `Fake Device ${n}` };
        }
        onBattery(cb) { this.batteryCb = cb; }
        async setPower(id, on) { this.calls.push({ m: "setPower", args: [id, on] }); }
        async setFrequency(id, hz) { this.calls.push({ m: "setFrequency", args: [id, hz] }); }
        async disconnect(id) { this.calls.push({ m: "disconnect", args: [id] }); }
        onDisconnect(cb) { this.disconnectCb = cb; }
        simulateDisconnect(id) { if (this.disconnectCb) this.disconnectCb(id); }
      }

      // ===== BLE: real Web Bluetooth =====
      class WebBluetoothService {
        constructor() { this.conns = new Map(); this.disconnectCb = null; }
        isSupported() { return typeof navigator !== "undefined" && !!navigator.bluetooth; }
        async requestDevice() {
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ services: [MOTOR_SERVICE_UUID] }, { namePrefix: DEVICE_NAME_PREFIX }],
            optionalServices: [BATTERY_SERVICE_UUID, MOTOR_SERVICE_UUID],
          });
          const id = device.id;
          const onDrop = () => { this.conns.delete(id); if (this.disconnectCb) this.disconnectCb(id); };
          const conn = await this.openConnection(device, onDrop);
          this.conns.set(id, conn);
          device.addEventListener("gattserverdisconnected", onDrop);
          this.startBattery(conn, id);
          return { id, name: device.name ?? "Vibration device" };
        }
        async openConnection(device, onDrop) {
          if (!device.gatt) throw new Error("GATT not available on this device");
          const server = await device.gatt.connect();
          const motorService = await server.getPrimaryService(MOTOR_SERVICE_UUID);
          const motor = await motorService.getCharacteristic(MOTOR_CHAR_UUID);
          let battery = null;
          try {
            const battService = await server.getPrimaryService(BATTERY_SERVICE_UUID);
            battery = await battService.getCharacteristic(BATTERY_LEVEL_CHAR_UUID);
          } catch (e) { battery = null; } // older firmware without battery char
          return { device, motor, battery, onDrop, power: false, freq: 120 };
        }
        async startBattery(conn, id) {
          if (!conn.battery) return;
          try {
            const v = await conn.battery.readValue();
            if (this.batteryCb) this.batteryCb(id, v.getUint8(0));
            await conn.battery.startNotifications();
            conn.batteryHandler = (e) => { if (this.batteryCb) this.batteryCb(id, e.target.value.getUint8(0)); };
            conn.battery.addEventListener("characteristicvaluechanged", conn.batteryHandler);
          } catch (e) { console.warn("battery unavailable", e); }
        }
        onBattery(cb) { this.batteryCb = cb; }
        get(id) {
          const c = this.conns.get(id);
          if (!c) throw new Error(`device ${id} not connected`);
          return c;
        }
        // One GATT op per device at a time. Coalesce rapid changes (slider drag):
        // keep one write in flight, and if more arrive, send one more with the
        // latest c.power/c.freq. Errors are swallowed so callers can't leak a
        // rejection; the firmware stops the motor on disconnect anyway.
        async write(c) {
          if (c.writing) { c.writeAgain = true; return c.writeChain; }
          c.writing = true;
          c.writeChain = (async () => {
            try {
              do {
                c.writeAgain = false;
                await c.motor.writeValue(encodeMotor(c.power, c.freq));
              } while (c.writeAgain);
            } catch (e) {
              console.warn("motor write failed", e);
            } finally {
              c.writing = false;
            }
          })();
          return c.writeChain;
        }
        async setPower(id, on) { const c = this.get(id); c.power = on; await this.write(c); }
        async setFrequency(id, hz) { const c = this.get(id); c.freq = hz; await this.write(c); }
        async disconnect(id) {
          const conn = this.conns.get(id);
          if (!conn) return;
          conn.device.removeEventListener("gattserverdisconnected", conn.onDrop);
          if (conn.battery && conn.batteryHandler) conn.battery.removeEventListener("characteristicvaluechanged", conn.batteryHandler);
          if (conn.device.gatt) conn.device.gatt.disconnect();
          this.conns.delete(id);
        }
        onDisconnect(cb) { this.disconnectCb = cb; }
      }

      // ===== Safe DOM helper (no innerHTML — names are untrusted) =====
      function h(tag, props = {}, children = []) {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(props)) {
          if (k.startsWith("on") && typeof v === "function") {
            el.addEventListener(k.slice(2).toLowerCase(), v);
          } else if (typeof v === "boolean") {
            if (v) el.setAttribute(k, "");
          } else {
            el.setAttribute(k, String(v));
          }
        }
        for (const c of children) el.append(typeof c === "string" ? document.createTextNode(c) : c);
        return el;
      }
      function clear(root) { root.replaceChildren(); }

      // ===== Modal host: focus trap, Escape, ARIA dialog, no stacking =====
      let activeModalClose = null;
      function presentModal(buildContent, onClose) {
        if (activeModalClose) return null; // one modal at a time
        const prevFocus = document.activeElement;
        const overlay = h("div", { class: "modal-overlay", role: "dialog", "aria-modal": "true" });
        const focusables = () =>
          Array.from(overlay.querySelectorAll('button, input, select, textarea, a[href], [tabindex]:not([tabindex="-1"])'))
            .filter((el) => !el.disabled);
        const onKey = (e) => {
          if (e.key === "Escape") { e.preventDefault(); close(); return; }
          if (e.key !== "Tab") return;
          const f = focusables();
          if (!f.length) return;
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        };
        function close() {
          if (activeModalClose !== close) return;
          document.removeEventListener("keydown", onKey, true);
          overlay.remove();
          activeModalClose = null;
          if (prevFocus && prevFocus.focus) prevFocus.focus();
          if (onClose) onClose();
        }
        overlay.append(buildContent(close));
        overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
        activeModalClose = close;
        document.addEventListener("keydown", onKey, true);
        document.body.append(overlay);
        const f = focusables();
        if (f.length) f[0].focus();
        return close;
      }

      // ===== Profile Form =====
      function createProfileForm(initialData = null, onSave, onCancel) {
        const isEdit = !!initialData;
        const form = h("div", { class: "form-group" }, [
          h("div", { class: "form-field" }, [
            h("label", {}, ["Preset name"]),
            h("input", {
              type: "text",
              value: initialData?.name || "",
              "data-field": "name",
              "data-role": "profile-name",
              onInput: (e) => validateForm(),
            }),
          ]),
          h("div", { class: "form-field" }, [
            h("label", {}, ["Frequency (Hz)"]),
            h("input", {
              type: "number",
              inputmode: "numeric",
              min: "80",
              max: "160",
              value: initialData?.frequency || "120",
              "data-field": "frequency",
              "data-role": "profile-frequency",
              onInput: (e) => validateForm(),
            }),
          ]),
          h("div", { class: "form-field" }, [
            h("label", {}, ["Duration (minutes)"]),
            h("input", {
              type: "number",
              inputmode: "numeric",
              min: "1",
              max: "60",
              value: initialData?.duration || "5",
              "data-field": "duration",
              "data-role": "profile-duration",
              onInput: (e) => validateForm(),
            }),
          ]),
          h("div", { "data-role": "form-error", class: "error-message" }),
          h("div", { class: "form-actions" }, [
            h("button", {
              "data-action": "save",
              onClick: () => {
                const name = form.querySelector('[data-field="name"]').value;
                const freq = Number(form.querySelector('[data-field="frequency"]').value);
                const dur = Number(form.querySelector('[data-field="duration"]').value);
                if (!ProfileStore.valid(name, freq, dur)) {
                  form.querySelector('[data-role="form-error"]').textContent = "Invalid input";
                  return;
                }
                onSave({ name, frequency: freq, duration: dur });
              },
            }, [isEdit ? "Update" : "Create"]),
            h("button", { class: "cancel", onClick: onCancel }, ["Cancel"]),
          ]),
        ]);
        const validateForm = () => {
          const name = form.querySelector('[data-field="name"]').value;
          const freq = Number(form.querySelector('[data-field="frequency"]').value);
          const dur = Number(form.querySelector('[data-field="duration"]').value);
          const error = form.querySelector('[data-role="form-error"]');
          let msg = "";
          if (!name) msg = "Name required";
          else if (freq < 80 || freq > 160) msg = "Frequency 80–160 Hz";
          else if (dur < 1 || dur > 60) msg = "Duration 1–60 min";
          error.textContent = msg;
        };
        return form;
      }

      // ===== Device Picker (content builder; mounted via presentModal) =====
      function buildDevicePicker(devices, onConfirm, close) {
        const selected = new Set(devices.map((d) => d.id)); // default: all selected
        const errorEl = h("div", { class: "error-message", role: "alert" });
        return h("div", { class: "modal-content", "data-role": "device-picker-modal" }, [
          h("div", { class: "modal-header" }, ["Select Devices"]),
          h("div", { class: "device-picker" }, devices.map((d) =>
            h("label", {}, [
              h("input", {
                type: "checkbox",
                checked: true,
                onChange: (e) => {
                  if (e.target.checked) selected.add(d.id);
                  else selected.delete(d.id);
                  errorEl.textContent = "";
                },
              }),
              ` ${d.name}`,
            ])
          )),
          errorEl,
          h("div", { class: "form-actions" }, [
            h("button", {
              onClick: () => {
                if (selected.size === 0) { errorEl.textContent = "Select at least one device"; return; }
                close();
                onConfirm(Array.from(selected));
              },
            }, ["Start"]),
            h("button", { class: "cancel", onClick: () => close() }, ["Cancel"]),
          ]),
        ]);
      }

      // ===== Profiles View =====
      function renderProfilesSection(root, { store, profileStore, ble, onStartProfile, onEditProfile, onDeleteProfile, onCreateProfile }) {
        clear(root);
        const section = h("section", { class: "profiles-section" }, [
          h("h2", {}, ["Presets"]),
        ]);

        const profiles = profileStore.getAll();
        const noDevices = store.get().devices.length === 0;
        if (profiles.length === 0) {
          section.append(h("p", {}, ["No presets yet. Create one to get started."]));
        } else {
          if (noDevices) section.append(h("p", { class: "hint" }, ["Connect a device to run a preset."]));
          for (const p of profiles) {
            const card = h("div", { class: "profile-card", "data-id": p.id }, [
              h("div", { class: "profile-info" }, [
                h("div", { class: "profile-name" }, [p.name]),
                h("div", { class: "profile-meta" }, [`${p.frequency} Hz, ${p.duration} min`]),
              ]),
              h("div", { class: "profile-actions" }, [
                h("button", {
                  "data-action": "start",
                  disabled: noDevices,
                  onClick: () => onStartProfile(p.id),
                }, ["Start"]),
                h("div", { class: "profile-subactions" }, [
                  h("button", {
                    class: "secondary",
                    "data-action": "edit",
                    onClick: () => onEditProfile(p.id),
                  }, ["Edit"]),
                  h("button", {
                    class: "secondary",
                    "data-action": "delete",
                    onClick: () => onDeleteProfile(p.id),
                  }, ["Delete"]),
                ]),
              ]),
            ]);
            section.append(card);
          }
        }

        const createBtn = h("button", {
          class: "add-btn",
          "data-action": "create",
          onClick: onCreateProfile,
        }, ["+ New preset"]);
        section.append(createBtn);

        root.append(section);
      }

      // ===== Timer view =====
      function renderTimerView(root, { profileStore, timer, onStop }) {
        clear(root);
        if (!timer.isRunning) return;
        const profile = profileStore.get(timer.profileId);
        const n = timer.deviceIds.length;
        root.append(h("section", { class: "timer-display" }, [
          h("h2", {}, [profile ? `Running: ${profile.name}` : "Running"]),
          h("div", { class: "timer-countdown", "data-role": "countdown" }, [timer.formatTime(Math.max(0, timer.secondsLeft))]),
          h("div", { class: "timer-devices" }, [`${n} device${n === 1 ? "" : "s"}`]),
          h("button", { class: "timer-stop", onClick: onStop }, ["Stop"]),
        ]));
      }

      // ===== Connect view =====
      function renderConnectView(root, { store, ble, onAdded }) {
        const atLimit = store.get().devices.length >= MAX_DEVICES;
        const error = h("p", { class: "hint", "data-role": "error" });
        const btn = h(
          "button",
          {
            class: "add-btn",
            "data-action": "add",
            disabled: atLimit,
            onClick: async () => {
              error.textContent = "";
              try {
                const dev = await ble.requestDevice();
                store.addDevice(dev.id, dev.name);
                // Sync the new device to the current global state so UI and motor agree.
                pushSettings(ble, dev.id, store.get().global).catch(() => {});
                onAdded(dev.id);
              } catch (e) {
                // Cancelling the chooser is not an error.
                if (e && (e.name === "NotFoundError" || e.name === "AbortError")) error.textContent = "";
                else error.textContent = (e && e.message) || "Could not connect";
              }
            },
          },
          [atLimit ? "4 devices connected" : "+ Add device"],
        );
        clear(root);
        root.append(h("section", { class: "connect" }, [btn, error]));
      }

      // ===== Control view =====
      function rangeWithValue(control, min, max, value, unit, onInput) {
        const num = h("input", { type: "number", inputmode: "numeric", min, max, value, "data-control": control + "-num", "aria-label": `${control} ${unit}` });
        const range = h("input", {
          type: "range", "data-control": control, min, max, value,
          onInput: (e) => { const v = Number(e.target.value); num.value = v; onInput(v); },
        });
        // Typing a number commits on blur/Enter; clamp and sync the slider back.
        num.addEventListener("change", () => {
          const v = clamp(Number(num.value), min, max);
          num.value = v; range.value = v; onInput(v);
        });
        return [range, h("span", { class: "value-readout" }, [num, ` ${unit}`])];
      }
      function checkbox(control, checked, disabled, onChange) {
        return h("input", {
          type: "checkbox", "data-control": control, checked, disabled,
          onChange: (e) => onChange(e.target.checked),
        });
      }
      function followIds(store) {
        return store.get().devices.filter((d) => d.mode === "follow").map((d) => d.id);
      }
      function globalBar(store, ble) {
        const g = store.get().global;
        return h("section", { "data-role": "global", class: "global-bar" }, [
          h("h2", {}, ["All devices"]),
          h("label", {}, ["Power", checkbox("power", g.power, false, (v) => {
            store.setGlobal({ power: v });
            for (const id of followIds(store)) ble.setPower(id, v);
          })]),
          h("label", {}, ["Frequency", ...rangeWithValue("frequency", FREQ_MIN, FREQ_MAX, g.frequency, "Hz", (v) => {
            store.setGlobal({ frequency: v });
            for (const id of followIds(store)) ble.setFrequency(id, v);
          })]),
        ]);
      }
      function batteryPillClass(pct) {
        return "battery-pill" + (pct <= 15 ? " low" : pct <= 40 ? " warn" : "");
      }
      function deviceCard(d, store, ble, rerender) {
        const id = d.id;
        const s = resolveSettings(store.get(), id);
        const disabled = d.mode === "follow";
        return h("article", { "data-role": "device-card", "data-id": id }, [
          h("header", {}, [
            d.name,
            d.battery != null ? h("span", { class: batteryPillClass(d.battery) }, [`\u{1F50B} ${d.battery}%`]) : "",
          ]),
          h("label", {}, ["Custom", checkbox("mode", d.mode === "custom", false, (v) => {
            // Snapshot the live global into custom so the device keeps its current
            // output when switching follow -> custom (no stale jump, no extra write).
            if (v) store.setDeviceCustom(id, store.get().global);
            store.setDeviceMode(id, v ? "custom" : "follow");
            if (!v) pushSettings(ble, id, resolveSettings(store.get(), id));
            rerender();
          })]),
          h("label", {}, ["Power", checkbox("power", s.power, disabled, (v) => {
            store.setDeviceCustom(id, { power: v });
            ble.setPower(id, v);
          })]),
          h("label", {}, ["Frequency", ...rangeWithValue("frequency", FREQ_MIN, FREQ_MAX, s.frequency, "Hz", (v) => {
            store.setDeviceCustom(id, { frequency: v });
            ble.setFrequency(id, v);
          })]),
          h("button", { "data-control": "remove", onClick: () => {
            ble.disconnect(id);
            store.removeDevice(id);
            rerender();
          } }, ["Remove"]),
        ]);
      }
      function renderControlView(root, opts) {
        const { store, ble } = opts;
        // Use the full app re-render when provided: adding/removing a device also
        // affects the presets section (Start enabled state), not just this view.
        const rerender = opts.rerender || (() => renderControlView(root, opts));
        clear(root);
        root.append(globalBar(store, ble));
        const cards = h("section", { class: "cards" });
        for (const d of store.get().devices) cards.append(deviceCard(d, store, ble, rerender));
        root.append(cards);
      }

      // ===== Bootstrap =====
      const app = document.getElementById("app");
      const useFake = new URLSearchParams(location.search).has("fake");
      const ble = useFake ? new FakeBleService() : new WebBluetoothService();

      if (!ble.isSupported()) {
        clear(app);
        app.append(
          h("div", { class: "unsupported" }, [
            h("h1", {}, ["Bluetooth not available in this browser"]),
            h("p", {}, ["On Android or desktop, open this page in Chrome or Edge."]),
            h("p", {}, ["On iPhone or iPad, install the free Bluefy browser, then open this page inside it."]),
          ]),
        );
      } else {
        const store = new AppStore();
        const profileStore = new ProfileStore();
        const timer = new TimerState();
        app.append(h("div", { class: "app-title" }, ["Vibration Station"]));
        const connectRoot = document.createElement("div");
        const timerRoot = document.createElement("div");
        const controlRoot = document.createElement("div");
        const presetsRoot = document.createElement("div");
        app.append(timerRoot, presetsRoot, controlRoot, connectRoot);

        // Power-off a disconnected device throws "not connected"; swallow it.
        const powerOffAll = (ids) => {
          for (const did of ids) Promise.resolve(ble.setPower(did, false)).catch(() => {});
        };
        const onStop = () => {
          const ids = [...timer.deviceIds];
          timer.stop();
          powerOffAll(ids);
          renderAll();
        };
        const renderAll = () => {
          if (timer.isRunning) {
            clear(connectRoot); clear(controlRoot); clear(presetsRoot);
            renderTimerView(timerRoot, { profileStore, timer, onStop });
          } else {
            clear(timerRoot);
            renderConnectView(connectRoot, { store, ble, onAdded: () => renderAll() });
            renderControlView(controlRoot, { store, ble, rerender: renderAll });
            renderProfilesSection(presetsRoot, { store, profileStore, ble, onStartProfile, onEditProfile, onDeleteProfile, onCreateProfile });
          }
        };

        const openForm = (initialData) => {
          presentModal((close) => {
            const form = createProfileForm(initialData, (data) => {
              const ok = initialData
                ? profileStore.update(initialData.id, data.name, data.frequency, data.duration)
                : profileStore.create(data.name, data.frequency, data.duration);
              if (!ok) { form.querySelector('[data-role="form-error"]').textContent = "Couldn't save (storage full?)"; return; }
              close();
              renderAll();
            }, () => close());
            return h("div", { class: "modal-content" }, [
              h("div", { class: "modal-header" }, [initialData ? "Edit preset" : "New preset"]),
              form,
            ]);
          });
        };
        const confirmAction = (message, onYes) => {
          presentModal((close) => h("div", { class: "modal-content" }, [
            h("div", { class: "modal-header" }, ["Confirm"]),
            h("p", {}, [message]),
            h("div", { class: "form-actions" }, [
              h("button", { onClick: () => { close(); onYes(); } }, ["Delete"]),
              h("button", { class: "cancel", onClick: () => close() }, ["Cancel"]),
            ]),
          ]));
        };
        const onCreateProfile = () => openForm(null);
        const onEditProfile = (id) => openForm(profileStore.get(id));
        const onDeleteProfile = (id) => {
          const p = profileStore.get(id);
          confirmAction(`Delete preset "${p ? p.name : ""}"?`, () => { profileStore.delete(id); renderAll(); });
        };
        const runProfile = (profile, deviceIds) => {
          for (const did of deviceIds) {
            // Chain the two writes: both hit one GATT characteristic, so firing
            // them concurrently can throw "operation already in progress".
            Promise.resolve(ble.setFrequency(did, profile.frequency))
              .then(() => ble.setPower(did, true))
              .catch(() => {});
          }
          const started = timer.start(profile, deviceIds,
            (secs) => {
              const el = timerRoot.querySelector('[data-role="countdown"]');
              if (el) el.textContent = timer.formatTime(Math.max(0, secs));
            },
            () => { powerOffAll(deviceIds); renderAll(); },
          );
          if (started === false) { powerOffAll(deviceIds); return; } // invalid duration
          renderAll();
        };
        const onStartProfile = (id) => {
          const profile = profileStore.get(id);
          if (!profile) return;
          const devices = store.get().devices;
          if (devices.length === 0) return; // Start is disabled with no devices
          if (devices.length === 1) { runProfile(profile, [devices[0].id]); return; }
          // Multiple devices: let the user pick which ones this preset runs on.
          presentModal(
            (close) => buildDevicePicker(devices, (selectedIds) => runProfile(profile, selectedIds), close),
            () => {},
          );
        };

        // Update only the affected device's battery pill. A full renderAll here
        // (fired every few seconds by notifications) would destroy any slider
        // drag or number-input edit in progress.
        const updateBatteryPill = (id, pct) => {
          const cards = controlRoot.querySelectorAll('[data-role="device-card"]');
          for (const card of cards) {
            if (card.getAttribute("data-id") !== id) continue;
            const header = card.querySelector("header");
            let pill = header.querySelector(".battery-pill");
            if (pct == null) { if (pill) pill.remove(); return; }
            if (!pill) {
              pill = document.createElement("span");
              header.append(pill);
            }
            pill.className = batteryPillClass(pct);
            pill.textContent = `\u{1F50B} ${pct}%`;
            return;
          }
        };
        ble.onDisconnect((id) => {
          store.removeDevice(id);
          if (timer.isRunning) {
            timer.deviceIds = timer.deviceIds.filter((d) => d !== id);
            if (timer.deviceIds.length === 0) timer.stop();
          }
          renderAll();
        });
        ble.onBattery((id, pct) => { store.setDeviceBattery(id, pct); updateBatteryPill(id, pct); });

        // setInterval is suspended while the phone is locked/backgrounded, so the
        // timer's own onComplete may not fire on time. On resume, if the session
        // has expired, stop the motors immediately. (A firmware-side timeout is
        // the real safety net; this covers the app side.)
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState !== "visible") return;
          if (timer.isRunning && (timer.endTime - performance.now()) / 1000 <= 0) {
            const ids = [...timer.deviceIds];
            timer.stop();
            powerOffAll(ids);
            renderAll();
          }
        });

        renderAll();
      }

      // Visible build stamp so you can confirm which version actually loaded.
      document.body.append(h("p", { class: "version" }, [`build ${VERSION}`]));

      // Offline cache (only when served over http/https; skipped on file://)
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
